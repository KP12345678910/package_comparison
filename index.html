<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Awaylo — Coming Soon</title>
<meta
  name="description"
  content="Awaylo is a package holiday comparison and discovery platform for UK travellers."
>
<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 24px;
  background: #f7f7f8;
  color: #18181b;
  font-family: Inter, Arial, sans-serif;
}

.page {
  width: 100%;
  min-height: calc(100vh - 48px);
  display: flex;
  flex-direction: column;
}

main {
  flex: 1;
  display: grid;
  place-items: center;
  text-align: center;
}

.content {
  width: 100%;
  max-width: 720px;
}

h1 {
  margin: 0 0 14px;
  font-size: clamp(42px, 9vw, 88px);
  letter-spacing: -.06em;
}

p {
  margin: 0 auto;
  max-width: 580px;
  font-size: clamp(18px, 3vw, 24px);
  line-height: 1.5;
  color: #52525b;
}

.badge {
  display: inline-block;
  margin-bottom: 24px;
  padding: 8px 12px;
  border: 1px solid #d4d4d8;
  border-radius: 999px;
  background: #fff;
  font-size: 14px;
  font-weight: 700;
}

footer {
  width: 100%;
  max-width: 900px;
  margin: 48px auto 0;
  padding: 24px 0 8px;
  border-top: 1px solid #e4e4e7;
  color: #71717a;
  font-size: 14px;
  line-height: 1.6;
  text-align: center;
}

.footer-links {
  margin: 8px 0 10px;
}

.footer-links a {
  color: inherit;
  text-decoration: none;
}

.footer-links a:hover {
  text-decoration: underline;
}

.footer-disclosure {
  max-width: 620px;
  margin: 0 auto;
}
</style>
</head>

<body>
<div class="page">

<main>
  <div class="content">
    <div class="badge">UNDER DEVELOPMENT</div>
    <h1>Awaylo</h1>
    <p>
      A smarter way to discover and compare package holidays is on the way.
    </p>
  </div>
</main>

<footer>
  <div>© 2026 Awaylo</div>

  <div class="footer-links">
    <a href="/about.html">About</a>
    <span> · </span>
    <a href="/contact.html">Contact</a>
    <span> · </span>
    <a href="/privacy.html">Privacy</a>
    <span> · </span>
    <a href="/cookies.html">Cookies</a>
    <span> · </span>
    <a href="/terms.html">Terms</a>
  </div>

  <div class="footer-disclosure">
    We may earn commission from selected travel providers at no extra cost to you.
  </div>
</footer>

</div>

</html>
